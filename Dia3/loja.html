<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Código &amp; Café</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --borda: #334155;
        --texto: #e2e8f0;
        --suave: #94a3b8;
        --destaque: #f59e0b;
        --ok: #22c55e;
        --erro: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
        background: linear-gradient(160deg, #0f172a, #1e1b16);
        color: var(--texto);
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 20px;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--destaque);
        font-size: 2rem;
      }

      header p {
        margin: 4px 0 0;
        color: var(--suave);
      }

      .card {
        padding: 24px;
        border: 1px solid var(--borda);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 10px 30px rgb(0 0 0 / 35%);
      }

      h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      label,
      legend {
        color: var(--suave);
        font-size: 0.9rem;
        font-weight: 600;
      }

      input[type='text'],
      input[type='number'],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--borda);
        border-radius: 8px;
        background: var(--bg);
        color: var(--texto);
        font-size: 1rem;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        outline: 2px solid var(--destaque);
        outline-offset: 1px;
      }

      fieldset {
        margin: 0 0 16px;
        padding: 0;
        border: 0;
      }

      .opcoes {
        display: flex;
        gap: 20px;
        margin-top: 6px;
      }

      .opcoes label,
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--texto);
        font-weight: 400;
      }

      .check {
        margin-bottom: 16px;
      }

      .linha {
        display: flex;
        gap: 8px;
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--destaque);
        color: #1c1917;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      button.secundario {
        border: 1px solid var(--borda);
        background: transparent;
        color: var(--texto);
      }

      button.principal {
        width: 100%;
        padding: 14px;
      }

      button:hover {
        filter: brightness(1.1);
      }

      .mensagem {
        min-height: 1.2em;
        margin: 6px 0 0;
        font-size: 0.9rem;
      }

      .mensagem.erro {
        color: var(--erro);
      }

      .mensagem.ok {
        color: var(--ok);
      }

      .resumo {
        margin: 8px 0 20px;
        padding: 14px 16px;
        border-radius: 10px;
        background: var(--bg);
      }

      .resumo p {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
      }

      .resumo .total {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--borda);
        color: var(--destaque);
        font-size: 1.25rem;
        font-weight: 700;
      }

      #confirmacao {
        text-align: center;
      }

      #confirmacao h2 {
        color: var(--ok);
        font-size: 1.6rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Código &amp; Café</h1>
        <p>Faça seu pedido em poucos passos</p>
      </header>

      <form id="pedido" class="card" novalidate>
        <h2>Seu pedido</h2>

        <div class="campo">
          <label for="nome">Nome do cliente</label>
          <input type="text" id="nome" placeholder="Ex.: Maria Silva" autocomplete="off" />
        </div>

        <div class="campo">
          <label for="tipo">Tipo de café</label>
          <select id="tipo">
            <option value="20">Café tradicional — R$ 20,00</option>
            <option value="25">Cappuccino — R$ 25,00</option>
            <option value="30">Latte — R$ 30,00</option>
          </select>
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="1" max="10" value="1" />
        </div>

        <div class="campo">
          <label for="cupom">Cupom de desconto</label>
          <div class="linha">
            <input type="text" id="cupom" placeholder="Ex.: CAFE10" autocomplete="off" />
            <button type="button" id="aplicar" class="secundario">Aplicar cupom</button>
          </div>
          <p id="msg-cupom" class="mensagem" role="status"></p>
        </div>

        <fieldset>
          <legend>Forma de pagamento</legend>
          <div class="opcoes">
            <label><input type="radio" name="pagamento" value="Pix" checked /> Pix</label>
            <label><input type="radio" name="pagamento" value="Cartão" /> Cartão</label>
          </div>
        </fieldset>

        <label class="check"><input type="checkbox" id="viagem" /> Embalar para viagem</label>

        <div class="resumo" aria-label="Resumo do pedido">
          <p><span>Subtotal</span><span id="subtotal">R$ 20,00</span></p>
          <p><span>Desconto</span><span id="desconto">R$ 0,00</span></p>
          <p class="total"><span>Total</span><span id="total">R$ 20,00</span></p>
        </div>

        <p id="erro-form" class="mensagem erro" role="alert"></p>
        <button type="submit" class="principal">Finalizar pedido</button>
      </form>

      <section id="confirmacao" class="card" hidden>
        <h2>Pedido confirmado</h2>
        <p id="detalhes"></p>
        <button type="button" id="novo" class="secundario">Fazer novo pedido</button>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const moeda = (v) => `R$ ${v.toFixed(2).replace('.', ',')}`;
      const CUPONS = { CAFE10: 0.1 };
      let desconto = 0;

      function quantidade() {
        const q = parseInt($('quantidade').value, 10);
        return Number.isNaN(q) ? 0 : Math.min(Math.max(q, 0), 10);
      }

      function atualizar() {
        const subtotal = Number($('tipo').value) * quantidade();
        const valorDesconto = subtotal * desconto;
        $('subtotal').textContent = moeda(subtotal);
        $('desconto').textContent = moeda(valorDesconto);
        $('total').textContent = moeda(subtotal - valorDesconto);
      }

      $('tipo').addEventListener('change', atualizar);
      $('quantidade').addEventListener('input', atualizar);

      $('aplicar').addEventListener('click', () => {
        const codigo = $('cupom').value.trim().toUpperCase();
        const msg = $('msg-cupom');
        if (CUPONS[codigo]) {
          desconto = CUPONS[codigo];
          msg.textContent = `Cupom ${codigo} aplicado: 10% de desconto`;
          msg.className = 'mensagem ok';
        } else {
          desconto = 0;
          msg.textContent = 'Cupom inválido';
          msg.className = 'mensagem erro';
        }
        atualizar();
      });

      $('pedido').addEventListener('submit', (e) => {
        e.preventDefault();
        const nome = $('nome').value.trim();
        const erro = $('erro-form');

        if (!nome) {
          erro.textContent = 'Informe o nome do cliente';
          return;
        }
        if (quantidade() < 1) {
          erro.textContent = 'A quantidade deve ser de 1 a 10';
          return;
        }
        erro.textContent = '';

        const tipo = $('tipo').selectedOptions[0].textContent.split(' — ')[0];
        const pagamento = document.querySelector('input[name="pagamento"]:checked').value;
        const viagem = $('viagem').checked ? ' Embalado para viagem.' : '';

        $('detalhes').textContent =
          `Obrigado, ${nome}! ${quantidade()}x ${tipo}, total ${$('total').textContent}, ` +
          `pagamento via ${pagamento}.${viagem}`;
        $('pedido').hidden = true;
        $('confirmacao').hidden = false;
      });

      $('novo').addEventListener('click', () => {
        $('pedido').reset();
        $('msg-cupom').textContent = '';
        desconto = 0;
        atualizar();
        $('confirmacao').hidden = true;
        $('pedido').hidden = false;
      });
    </script>
  </body>
</html>
